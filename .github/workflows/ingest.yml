name: Ingest (list + rotation)

# Daily list install snapshots + 200-skill scrape rotation run on the secondary
# (backend/batch) OIDC budget. skills.sh rate-limits OIDC by Vercel
# team+project, so this workflow must not consume the primary app Backend
# budget used by real web/desktop users. Manual dispatch supports a one-shot
# full sweep toward MAX_ENRICHED.
#
# Secrets:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   VERCEL_TOKEN  # Vercel API token; used to mint a fresh OIDC token per run
#
# Vercel OIDC tokens live 12 hours, so they cannot be stored as static GitHub
# secrets for a daily cron. The "Mint ingest OIDC token" step below issues a
# fresh one on every run via `vercel project token`.
#
# See docs/developer/ingest-oidc.md

on:
  schedule:
    - cron: '15 6 * * *' # 06:15 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily = list + 200 rotation; sweep = leaderboard scrape to MAX_ENRICHED'
        required: true
        default: daily
        type: choice
        options:
          - daily
          - sweep
      max_enriched:
        description: 'Sweep cap (1500 default; use 1000 if too heavy)'
        required: false
        default: '1500'
        type: string

concurrency:
  group: ingest-skills
  cancel-in-progress: false

env:
  # Vercel project whose OIDC budget batch ingest spends. Not sensitive.
  #
  # skills.sh meters per (team, project), so batch ingest runs on the partner
  # (ingest) account and never touches the app account's budget. VERCEL_TOKEN
  # must belong to this account — `vercel project token` cannot mint OIDC for
  # a project it does not own. See docs/developer/ingest-oidc.md.
  VERCEL_INGEST_SCOPE: indhujas-projects
  VERCEL_INGEST_PROJECT: skills-explorer

jobs:
  ingest:
    name: List + rotate (or sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Mint ingest OIDC token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set; cannot mint an ingest OIDC token."
            exit 1
          fi
          # Pinned: a CLI release that changes `project token` output would
          # otherwise break the cron silently the next morning.
          # Parse the last stdout line only, so a banner or update notice from
          # the CLI cannot break JSON.parse.
          token=$(npx --yes vercel@59.3.0 project token "$VERCEL_INGEST_PROJECT" \
            --scope "$VERCEL_INGEST_SCOPE" --token "$VERCEL_TOKEN" --format=json --yes \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=s.trim().split("\n").pop();process.stdout.write(JSON.parse(l).token)})')
          echo "::add-mask::$token"
          # Fail here with a clear message rather than mid-pipeline on a 401.
          # Retry transient upstream failures: this runs once a day, so a single
          # 429 or 5xx would otherwise cost a whole day of ingest.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'Accept: application/json' -H "Authorization: Bearer $token" \
              'https://skills.sh/api/v1/skills?view=all-time&page=0&per_page=1' || echo 000)
            case "$code" in
              200) break ;;
              401 | 403)
                echo "::error::skills.sh rejected the freshly minted OIDC token (HTTP $code). Check OIDC Federation on $VERCEL_INGEST_SCOPE/$VERCEL_INGEST_PROJECT."
                exit 1
                ;;
              *)
                echo "skills.sh pre-flight attempt $attempt failed (HTTP $code)."
                [ "$attempt" = 3 ] || sleep $((attempt * 10))
                ;;
            esac
          done
          if [ "$code" != "200" ]; then
            echo "::error::skills.sh pre-flight failed after 3 attempts (HTTP $code)."
            exit 1
          fi
          echo "VERCEL_OIDC_TOKEN_SECONDARY=$token" >> "$GITHUB_ENV"

      - name: Daily list + rotation
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'daily' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --import tsx/esm scripts/ingest-daily.mjs

      - name: Full scrape sweep
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sweep' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_SWEEP_MAX: ${{ inputs.max_enriched }}
          THROTTLE_MS: '250'
          SCRAPE_SKIP_CACHED: '1'
        run: node --import tsx/esm scripts/scrape-sweep.mjs
